name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CPU-сборка torch: не тащим CUDA (~2.5 ГБ) - для YOLO на CPU она не нужна,
      # а exe получается в разы меньше
      - name: Install dependencies
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.146 opencv-python==4.11.0.86 pillow==11.2.1 pyyaml==6.0.2 requests
          pip install pyinstaller==6.14.1

      - name: Download FFmpeg
        run: python download_ffmpeg.py

      - name: Build EXE
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreestyleParser-windows-x64
          path: dist/FreestyleParser.exe
          if-no-files-found: error

      # exe в релиз прикрепляем только при пуше тега (v1.0.0 и т.п.)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FreestyleParser.exe
