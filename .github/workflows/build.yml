name: Build Windows EXE & Linux binary & macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  # нужно softprops/action-gh-release для создания релиза и загрузки ассетов;
  # у GITHUB_TOKEN по умолчанию доступ только на чтение
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Консоль раннера в cp1252 - русские print()'ы скриптов падают с UnicodeEncodeError
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      # Связка tr-ключей <-> locales/en.json: нет перевода / мёртвый ключ /
      # несовпадение плейсхолдеров - сборка падает до упаковки exe
      - name: Check locales
        run: python tools/check_locales.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CPU-сборка torch: не тащим CUDA (~2.5 ГБ) - для YOLO на CPU она не нужна,
      # а exe получается в разы меньше
      - name: Install dependencies
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.146 opencv-python==4.11.0.86 pillow==11.2.1 pyyaml==6.0.2 requests numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.0 supervision==0.25.1 lap==0.5.12 matplotlib==3.10.3 torchreid==0.2.5 gdown==6.4.0
          pip install pyinstaller==6.14.1

      - name: Download FFmpeg
        run: python download_ffmpeg.py

      - name: Build EXE
        run: python build.py

      - name: Zip dist (onedir)
        run: Compress-Archive -Path dist/FreestyleParser -DestinationPath dist/FreestyleParser-windows-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & $iscc installer/freestyleparser.iss /DAppVersion=$tag

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreestyleParser-windows-x64
          path: dist/FreestyleParser-windows-x64.zip
          if-no-files-found: error

      # zip в релиз прикрепляем только при пуше тега (v1.0.0 и т.п.)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FreestyleParser-windows-x64.zip
            dist/FreestyleParser-setup-*.exe
            tools/win-diagnostic.ps1

  build-linux:
    # 22.04, а не latest (24.04): бинарь собранный на glibc 2.39 не запустится
    # на Ubuntu 22.04; собранный на 2.35 работает и на 22.04, и на 24.04+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check locales
        run: python tools/check_locales.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Рантайм-библиотеки cv2 (libGL/libglib) в manylinux-колесе opencv не включены
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 xvfb

      - name: Install dependencies
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.146 opencv-python==4.11.0.86 pillow==11.2.1 pyyaml==6.0.2 requests numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.0 supervision==0.25.1 lap==0.5.12 matplotlib==3.10.3 torchreid==0.2.5 gdown==6.4.0
          pip install pyinstaller==6.14.1

      # Tkinter именно питона раннера попадёт в бинарник (PyInstaller пакует его tcl/tk),
      # поэтому проверяем, что он реально работает, а не просто импортируется
      - name: Smoke-test Tkinter
        run: >-
          xvfb-run -a python -c "import tkinter; root = tkinter.Tk();
          print('Tk OK:', root.tk.call('tk', 'windowingsystem')); root.destroy()"

      - name: Download FFmpeg
        run: python download_ffmpeg.py

      - name: Build binary
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreestyleParser-linux-x64
          path: dist/FreestyleParser
          if-no-files-found: error

      # В релиз кладём с явным именем, чтобы не путать с exe
      - name: Rename binary for release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp dist/FreestyleParser dist/FreestyleParser-linux-x64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FreestyleParser-linux-x64

  build-macos:
    # Homebrew-питон с Tcl/Tk 9: инсталляторы python.org (actions/setup-python)
    # бандлят Tk 8.6, а код рассчитан на Tk 9 (<TouchpadScroll> и т.п.);
    # локальная dev-сборка - тоже brew python 3.13 + Tk 9.0
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # python3.13 -> brew -> tcl-tk 9; пин к кегу brew: голый python3.13
      # на раннере может оказаться CLT-питоном без tkinter (стало причиной
      # v1.3.14: бандл без tkinter, приложение падало на старте)
      # python-tk@3.13 тянет tcl-tk 9; сам python@3.13 tkinter НЕ содержит -
      # без python-tk в бандле не окажется _tkinter (v1.3.14) и ассерт упадёт
      - name: Setup Python (Homebrew, Tcl/Tk 9)
        run: |
          brew install python@3.13 python-tk@3.13
          PY="$(brew --prefix python@3.13)/bin/python3.13"
          "$PY" -m venv env
          echo "$PWD/env/bin" >> "$GITHUB_PATH"
          # проверяем именно venv-питон, из которого пойдёт PyInstaller;
          # GITHUB_PATH на текущий шаг ещё не действует - python тут другой
          env/bin/python -c "import sys, tkinter; print(sys.executable); assert tkinter.TkVersion >= 9.0, tkinter.TkVersion; print('Tk OK:', tkinter.TkVersion)"

      - name: Check locales
        run: python tools/check_locales.py

      - name: Install dependencies
        run: |
          pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.146 opencv-python==4.11.0.86 pillow==11.2.1 pyyaml==6.0.2 requests numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.0 supervision==0.25.1 lap==0.5.12 matplotlib==3.10.3 torchreid==0.2.5 gdown==6.4.0
          pip install pyinstaller==6.14.1

      - name: Download FFmpeg
        run: python download_ffmpeg.py

      - name: Build .app
        run: python build.py

      # v1.3.14: tkinter не попал в бандл, приложение падало на старте
      - name: Verify tkinter in bundle
        run: find dist/FreestyleParser.app -name "_tkinter*" | grep . || exit 1

      - name: Build DMG
        run: |
          hdiutil create -volname FreestyleParser \
            -srcfolder dist/FreestyleParser.app \
            -format UDZO -ov \
            dist/FreestyleParser-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreestyleParser-macos-arm64
          path: dist/FreestyleParser-macos-arm64.dmg
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FreestyleParser-macos-arm64.dmg
